name = "myht-r5-command-center"
main = "src/worker.js"
compatibility_date = "2026-11-03"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Set these in Cloudflare dashboard as environment variables.
# NOTION_TOKEN, ACCESS_AUD, ACCESS_TEAM_DOMAIN, ALLOWED_EMAIL must be secrets.
# TASKS_DATA_SOURCE_ID and HR_DATA_SOURCE_ID are ordinary environment variables.
